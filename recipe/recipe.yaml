schema_version: 1

context:
  name: boost-histogram
  version: "1.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boost_histogram/boost_histogram-${{ version }}.tar.gz
  sha256: d1738fbb8b014fe3a4643005978299d6de267bcd4468852a84d42027df700ffd

build:
  number: 0
  script:
    - if: not win and not (linux and ppc64le)
      then: export CMAKE_BUILD_PARALLEL_LEVEL=${CPU_COUNT}
    # CMP0190=NEW + an emulator lets cmake 4.4 FindPython query the (runnable)
    # target interpreter when cross-compiling; without it the free-threaded
    # include dir is rejected (Python_FIND_ABI now always defined, gil=OFF)
    - if: build_platform != target_platform
      then: |
        ${{ PYTHON }} -m pip install . -v \
          -Ccmake.define.CMAKE_POLICY_DEFAULT_CMP0190=NEW \
          -Ccmake.define.CMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/env
      else: ${{ PYTHON }} -m pip install . -v

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - if: not win
      then: make
  host:
    - python
    - pip >=18
    - scikit-build-core
    - setuptools_scm
    - pybind11
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - boost_histogram
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - pytest >=6
        - pytest-benchmark
    script:
      - pytest --benchmark-disable

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: |
    The official Boost.Histogram Python bindings. Provides fast, efficient
    histogramming with a variety of different storages combined with dozens of
    composable axes. Part of the [Scikit-HEP](https://scikit-hep.org) family.
  homepage: https://github.com/scikit-hep/boost-histogram
  repository: https://github.com/scikit-hep/boost-histogram
  documentation: https://boost-histogram.readthedocs.io

extra:
  recipe-maintainers:
    - chrisburr
    - henryiii
    - HDembinski
